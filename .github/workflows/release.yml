name: Release

# Publishes a signed APK whenever a version tag is pushed:
#
#   git tag v0.1.0 && git push origin v0.1.0
#
# Requires four repository secrets (Settings → Secrets and variables → Actions):
#   KEYSTORE_BASE64    - base64 of your .jks  (base64 -i release.jks | pbcopy)
#   KEYSTORE_PASSWORD  - keystore password
#   KEY_ALIAS          - key alias
#   KEY_PASSWORD       - key password
#
# Without them the job fails fast rather than publishing an unsigned APK.

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version (for example 0.4.9; optional leading v is accepted)'
        required: true
        type: string

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      # Full history so the notes can be diffed against the previous tag.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify signing secrets are present
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::KEYSTORE_BASE64 is not set. Add the signing secrets before tagging a release."
            exit 1
          fi

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      # Tag pushes derive the version from the tag; manual runs take the input.
      # v1.2.3 -> versionName 1.2.3, versionCode 10203.
      - name: Derive and validate version
        id: version
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then
            NAME="${INPUT_VERSION#v}"
          else
            NAME="${GITHUB_REF_NAME#v}"
          fi
          if [[ ! "$NAME" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Version must be MAJOR.MINOR.PATCH, e.g. 0.4.9."
            exit 1
          fi
          IFS='.' read -r MAJOR MINOR PATCH <<< "$NAME"
          for PART in "$MAJOR" "$MINOR" "$PATCH"; do
            if (( 10#$PART > 99 )); then
              echo "::error::Each version component must be between 0 and 99."
              exit 1
            fi
          done
          CODE=$((10#$MAJOR * 10000 + 10#$MINOR * 100 + 10#$PATCH))
          if (( CODE < 1 )); then
            echo "::error::Version code must be at least 1."
            exit 1
          fi
          TAG="v$NAME"
          echo "name=$NAME" >> "$GITHUB_OUTPUT"
          echo "code=$CODE" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "versionName=$NAME  versionCode=$CODE"

      - name: Decode keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release.jks"

      # The single remaining Play variant produces both the sideload APK and AAB.
      - name: Build signed APK and App Bundle
        env:
          KEYSTORE_FILE: ${{ runner.temp }}/release.jks
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          APP_VERSION_NAME: ${{ steps.version.outputs.name }}
          APP_VERSION_CODE: ${{ steps.version.outputs.code }}
        run: |
          gradle assemblePlayRelease bundlePlayRelease --no-daemon --stacktrace \
            -PappVersionName="$APP_VERSION_NAME" \
            -PappVersionCode="$APP_VERSION_CODE"

      - name: Remove keystore
        if: always()
        run: rm -f "$RUNNER_TEMP/release.jks"

      - name: Collect artifacts
        env:
          RELEASE_TAG: ${{ steps.version.outputs.tag }}
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/play/release/*.apk \
             "dist/rns-launcher-${RELEASE_TAG}.apk"
          cp app/build/outputs/bundle/playRelease/*.aab \
             "dist/rns-launcher-${RELEASE_TAG}.aab"

      # The .aab is uploaded to Play, not installed by users, so it stays a build
      # artifact rather than going on the public release page.
      - name: Upload App Bundle for Play Console
        uses: actions/upload-artifact@v4
        with:
          name: play-bundle-${{ steps.version.outputs.tag }}
          path: dist/*.aab
          if-no-files-found: error

      # Commit subjects only: this is a personal project, so the release page
      # skips GitHub's generated "by @user" / "New Contributors" sections and
      # carries no install instructions — it is installed like any other app.
      - name: Compose release notes
        env:
          RELEASE_TAG: ${{ steps.version.outputs.tag }}
        run: |
          # Prefer the tag itself when it already exists (tag pushes, re-runs),
          # otherwise fall back to HEAD (manual runs, where the tag is created later).
          if git rev-parse -q --verify "refs/tags/$RELEASE_TAG" >/dev/null; then
            END="$RELEASE_TAG"
          else
            END="HEAD"
          fi
          # Nearest earlier tag reachable from END, so regenerating an old
          # release still diffs against its own predecessor.
          PREVIOUS=$(git tag --merged "$END" --sort=-v:refname | grep -vx "$RELEASE_TAG" | head -1 || true)
          if [ -n "$PREVIOUS" ]; then
            RANGE="$PREVIOUS..$END"
          else
            RANGE="$END"
          fi
          CHANGES=$(git log "$RANGE" --no-merges --pretty=format:'- %s')
          if [ -z "$CHANGES" ]; then
            CHANGES="- Maintenance release."
          fi
          {
            echo "## What changed"
            echo
            echo "$CHANGES"
          } > "$RUNNER_TEMP/notes.md"
          cat "$RUNNER_TEMP/notes.md"

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: ${{ steps.version.outputs.tag }}
          files: dist/*.apk
          fail_on_unmatched_files: true
          body_path: ${{ runner.temp }}/notes.md
